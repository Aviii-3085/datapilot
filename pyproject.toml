[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-kit"
version = "0.4.1"
description = "An open-source Python library for deterministic exploratory data analysis and dataset understanding."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Avishkar D. Gopale" }
]

keywords = [
    "eda",
    "exploratory-data-analysis",
    "data-analysis",
    "data-science",
    "dataset-profiling",
    "machine-learning",
    "analytics",
    "python"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "plotly>=6.0",
    "jinja2>=3.1",
    "rich>=14.0",
    "typer>=0.16",
    "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest"
]

[project.urls]
Homepage = "https://github.com/Aviii-3085/datapilot"
Repository = "https://github.com/Aviii-3085/datapilot"
Issues = "https://github.com/Aviii-3085/datapilot/issues"
Documentation = "https://github.com/Aviii-3085/datapilot/tree/main/docs"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[tool.setuptools.packages.find]
include = ["datapilot*"]
